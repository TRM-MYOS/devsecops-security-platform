name: Central Security Gate
description: Install security tools and run the existing Central scanner and policy

inputs:
  target-path:
    description: Target directory, relative to github.workspace or absolute
    required: true
  reports-path:
    description: Report directory, relative to github.workspace or absolute
    required: true

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install bandit PyYAML

    - name: Install Trivy
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install -y trivy

    - name: Install Gitleaks
      shell: bash
      run: |
        GITLEAKS_VERSION="8.28.0"
        wget -q \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          -O /tmp/gitleaks.tar.gz
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp
        sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
        gitleaks version

    - name: Run Central Security Gate
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        PYTHONPATH: ${{ github.action_path }}
        SECURITY_WORKSPACE: ${{ github.workspace }}
        SECURITY_TARGET_PATH: ${{ inputs.target-path }}
        SECURITY_REPORTS_PATH: ${{ inputs.reports-path }}
      run: |
        : "${SECURITY_TARGET_PATH:?target-path is required}"
        : "${SECURITY_REPORTS_PATH:?reports-path is required}"
        target_path="$SECURITY_TARGET_PATH"
        reports_path="$SECURITY_REPORTS_PATH"
        if [[ "$target_path" != /* ]]; then
          target_path="$SECURITY_WORKSPACE/$target_path"
        fi
        if [[ "$reports_path" != /* ]]; then
          reports_path="$SECURITY_WORKSPACE/$reports_path"
        fi
        exec python -m scanner.security_scanner "$target_path" "$reports_path"
