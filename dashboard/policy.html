<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Security Policy / DevSecOps</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="policy">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="auth-check" class="auth-check" role="status">
      Checking your session...
    </div>
    <div class="app" id="protected-app" hidden>
      <div id="navigation-shell"></div>
      <main class="main" id="main-content" tabindex="-1">
        <header class="topbar">
          <div class="page-title">
            <button
              type="button"
              class="mobile-menu icon-button"
              id="menu-toggle"
              aria-label="Open navigation"
              aria-controls="sidebar"
              aria-expanded="false"
            >
              <svg
                width="19"
                height="19"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
            <div>
              <p class="eyebrow">DEVSECOPS / WORKSPACE</p>
              <h1>Security Policy</h1>
              <p class="page-description">
                Read the current security rules. Changes are managed in the
                policy configuration.
              </p>
            </div>
          </div>
          <div class="account-controls">
            <div
              class="account-avatar"
              id="user-avatar"
              aria-hidden="true"
            ></div>
            <div class="account-details">
              <strong id="current-username"></strong
              ><span id="current-role"></span>
            </div>
            <button
              type="button"
              class="secondary-button compact"
              id="logout-button"
            >
              Log out
            </button>
          </div>
        </header>
        <div
          id="global-message"
          class="message-region"
          aria-live="polite"
        ></div>
        <div id="policy-container">
          <div class="loading">Loading the configured security policy...</div>
        </div>
        <footer class="main-footer">
          <span>DevSecOps Security Platform</span
          ><span>Central security / Clear decisions</span>
        </footer>
      </main>
    </div>
  </body>
</html>
