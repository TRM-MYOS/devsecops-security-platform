name: Central Security Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  security-scan:
    name: Run Central Security Scan
    runs-on: ubuntu-latest

    steps:

      # =================================================
      # 1. Checkout repository ที่เรียกใช้ Workflow
      # =================================================
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =================================================
      # 2. Setup Python
      # =================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # =================================================
      # 3. Install Python security tools
      # =================================================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit PyYAML

      # =================================================
      # 4. Install Trivy
      # =================================================
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      # =================================================
      # 5. Install Gitleaks
      # =================================================
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.28.0"

          wget -q \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -O /tmp/gitleaks.tar.gz

          tar -xzf /tmp/gitleaks.tar.gz -C /tmp

          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

          gitleaks version

      # =================================================
      # 6. Checkout Central Security Platform
      # =================================================
      # Central repository เป็น Public แล้ว
      # จึงไม่ต้องใช้ CENTRAL_REPO_TOKEN
      # =================================================
      - name: Checkout central security platform
        uses: actions/checkout@v4
        with:
          repository: TRM-MYOS/devsecops-security-platform
          ref: main
          path: .security-platform

      # =================================================
      # 7. Prepare report directory
      # =================================================
      - name: Prepare reports
        run: |
          mkdir -p reports

      # =================================================
      # 8. Run Bandit
      # =================================================
      - name: Run Bandit
        continue-on-error: true
        run: |
          bandit \
            -r . \
            -f json \
            -o reports/bandit.json \
            --exclude .git,.security-platform

      # =================================================
      # 9. Run Trivy
      # =================================================
      - name: Run Trivy
        continue-on-error: true
        run: |
          trivy fs \
            --format json \
            --output reports/trivy.json \
            --scanners vuln,secret,misconfig \
            .

      # =================================================
      # 10. Run Gitleaks
      # =================================================
      - name: Run Gitleaks
        continue-on-error: true
        run: |
          gitleaks detect \
            --source . \
            --no-banner \
            --report-format json \
            --report-path reports/gitleaks.json \
            --exit-code 0

      # =================================================
      # 11. Analyze Security Results
      # =================================================
      - name: Analyze security results
        id: security
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/.security-platform"

          python - <<'PY'
          from pathlib import Path
          import json
          import sys

          from security.parser import parse_reports
          from security.scoring import calculate_score, calculate_grade
          from security.policy import evaluate_policy


          reports = Path("reports")

          bandit_file = reports / "bandit.json"
          trivy_file = reports / "trivy.json"
          gitleaks_file = reports / "gitleaks.json"


          def ensure_json_file(path, default):
              if not path.exists() or path.stat().st_size == 0:
                  path.write_text(
                      json.dumps(default),
                      encoding="utf-8"
                  )


          ensure_json_file(
              bandit_file,
              {
                  "results": []
              }
          )

          ensure_json_file(
              trivy_file,
              {
                  "Results": []
              }
          )

          ensure_json_file(
              gitleaks_file,
              []
          )


          findings = parse_reports(
              bandit_file,
              trivy_file,
              gitleaks_file
          )

          score = calculate_score(findings)

          grade = calculate_grade(score)

          policy_result = evaluate_policy(
              findings,
              score
          )


          print("")
          print("========================================")
          print("       CENTRAL SECURITY GATE")
          print("========================================")
          print(f"Security Score : {score}/100")
          print(f"Security Grade : {grade}")
          print(f"Policy Status  : {policy_result['status']}")
          print(f"Reason         : {policy_result['reason']}")
          print(f"Total Findings : {len(findings)}")
          print("========================================")
          print("")


          if findings:
              print("Security Findings:")
              print("")

              for finding in findings:
                  print(
                      f"- [{finding.get('severity', 'UNKNOWN')}] "
                      f"{finding.get('scanner', 'UNKNOWN')} "
                      f"{finding.get('rule', finding.get('rule_id', ''))} "
                      f"{finding.get('message', '')}"
                  )


          if policy_result["status"] == "BLOCK":
              print("")
              print("❌ SECURITY GATE: BLOCK")
              print("The repository does not satisfy the security policy.")
              sys.exit(1)


          print("")
          print("✅ SECURITY GATE: ALLOW")
          print("The repository satisfies the security policy.")
          PY

      # =================================================
      # 12. Upload Security Reports
      # =================================================
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn