name: Central Security Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  security-scan:
    name: Run Central Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      - name: Run Central Security Gate
        uses: TRM-MYOS/devsecops-security-platform@main
        with:
          target-path: target
          reports-path: reports

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn
